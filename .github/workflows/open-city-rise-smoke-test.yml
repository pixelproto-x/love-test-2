name: Open City Rise Performance Smoke Test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'open-city-rise.html'
      - '.github/workflows/open-city-rise-smoke-test.yml'
permissions:
  contents: read
concurrency:
  group: open-city-rise-smoke
  cancel-in-progress: true
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve the exact checked-out game revision
        run: |
          python3 -m http.server 4173 --directory . >/tmp/open-city-rise-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/open-city-rise.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/open-city-rise-http.log
          exit 1
      - name: Test desktop, portrait phone, and landscape phone
        env:
          GAME_URL: http://127.0.0.1:4173/open-city-rise.html
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true, args: ['--use-gl=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist'] });
          const pageErrors = [];
          const url = process.env.GAME_URL;

          async function openGame(label, viewport, mobile) {
            const context = await browser.newContext({ viewport, deviceScaleFactor: 1, isMobile: mobile, hasTouch: mobile });
            const page = await context.newPage();
            page.on('pageerror', e => pageErrors.push(label + ': ' + e.message));
            let ready = false;
            for (let attempt = 0; attempt < 4 && !ready; attempt++) {
              await page.goto(url + '?smoke=' + Date.now() + '-' + label + '-' + attempt, { waitUntil: 'domcontentloaded', timeout: 45000 });
              try {
                await page.waitForFunction(() => !!window.__OPEN_CITY_DEBUG && document.querySelector('#startBtn')?.textContent.includes('進入城市'), null, { timeout: 45000 });
                ready = true;
              } catch { await page.waitForTimeout(2500); }
            }
            assert.ok(ready, label + ': game engine did not become ready; status=' + await page.locator('#status').innerText().catch(() => 'missing status'));
            assert.equal(await page.locator('canvas').count(), 2, label + ': expected 3D canvas and minimap');
            let stats = await page.evaluate(() => window.__OPEN_CITY_DEBUG.getStats());
            assert.ok(stats.buildings >= 245, label + ': city generation incomplete: ' + stats.buildings);
            assert.ok(stats.npcs >= 15 && stats.npcs <= 100, label + ': unexpected NPC count ' + stats.npcs);
            assert.ok(stats.cars >= 8 && stats.cars <= 35, label + ': unexpected traffic count ' + stats.cars);
            assert.ok(stats.drawCalls > 0 && stats.drawCalls < 350, label + ': draw calls exceed optimized target ' + stats.drawCalls);
            await page.screenshot({ path: 'artifacts/' + label + '-start.png' });
            await page.locator('#startBtn').click();
            await page.waitForFunction(() => getComputedStyle(document.querySelector('#startCover')).display === 'none');
            await page.waitForTimeout(2300);
            stats = await page.evaluate(() => window.__OPEN_CITY_DEBUG.getStats());
            assert.ok(stats.renderedFrames > 10, label + ': renderer did not advance frames');
            assert.ok(Number.isFinite(stats.renderRatio) && stats.renderRatio >= 0.54 && stats.renderRatio <= 1.26, label + ': invalid adaptive render scale');

            if (mobile) {
              assert.equal(await page.locator('#touchUI').evaluate(el => getComputedStyle(el).display !== 'none'), true, label + ': mobile controls hidden');
              const box = await page.locator('#touchActions').boundingBox();
              assert.ok(box && box.x >= 0 && box.y >= 0 && box.x + box.width <= viewport.width + 1 && box.y + box.height <= viewport.height + 1, label + ': touch actions clipped');
              const joy = await page.locator('#moveStick').boundingBox();
              const before = await page.evaluate(() => window.__OPEN_CITY_DEBUG.getPlayerPosition());
              await page.mouse.move(joy.x + joy.width / 2, joy.y + joy.height / 2);
              await page.mouse.down();
              await page.mouse.move(joy.x + joy.width / 2, joy.y + joy.height / 2 - 27, { steps: 4 });
              await page.waitForTimeout(850);
              await page.mouse.up();
              const after = await page.evaluate(() => window.__OPEN_CITY_DEBUG.getPlayerPosition());
              assert.ok(Math.hypot(after.x - before.x, after.z - before.z) > 0.25, label + ': touch joystick did not move the player');
            } else {
              assert.equal(await page.locator('#touchUI').evaluate(el => getComputedStyle(el).display === 'none'), true, 'desktop: touch controls should be hidden');
              assert.equal(await page.evaluate(() => document.pointerLockElement !== null), false, 'desktop: pointer locked automatically on start');
              const before = await page.evaluate(() => window.__OPEN_CITY_DEBUG.getPlayerPosition());
              await page.keyboard.down('w'); await page.waitForTimeout(850); await page.keyboard.up('w');
              const after = await page.evaluate(() => window.__OPEN_CITY_DEBUG.getPlayerPosition());
              assert.ok(Math.hypot(after.x - before.x, after.z - before.z) > 0.5, 'desktop: keyboard movement failed');
            }

            await page.locator('#trainerToggle').click();
            assert.equal(await page.locator('#trainer').evaluate(el => el.classList.contains('open')), true, label + ': trainer panel failed to open');
            await page.locator('#cash100').click();
            assert.equal(await page.locator('#money').innerText(), '$102,500', label + ': cash trainer button failed');
            await page.locator('#godBtn').click();
            assert.ok((await page.locator('#godBtn').innerText()).includes('開'), label + ': god-mode toggle failed');
            await page.screenshot({ path: 'artifacts/' + label + '-game.png' });
            console.log(label + ': OK; blocks=' + stats.buildings + ', NPCs=' + stats.npcs + ', cars=' + stats.cars + ', drawCalls=' + stats.drawCalls + ', renderFPS=' + stats.renderFPS + ', renderScale=' + stats.renderRatio);
            await context.close();
          }

          try {
            await openGame('desktop', { width: 1365, height: 768 }, false);
            await openGame('phone-portrait', { width: 390, height: 844 }, true);
            await openGame('phone-landscape', { width: 844, height: 390 }, true);
            assert.deepEqual(pageErrors, [], 'browser JavaScript errors: ' + pageErrors.join(' | '));
          } finally { await browser.close(); }
          NODE
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-city-rise-smoke-screenshots
          path: artifacts/
          if-no-files-found: ignore