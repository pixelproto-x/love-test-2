name: City Life Browser Smoke Test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lowpoly_crime_sandbox.html'
      - '.github/workflows/city-life-smoke-test.yml'
permissions:
  contents: read
concurrency:
  group: city-life-smoke-test
  cancel-in-progress: true
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test desktop, phone portrait, and phone landscape
        env:
          GAME_URL: https://pixelproto-x.github.io/love-test-2/lowpoly_crime_sandbox.html
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const base = process.env.GAME_URL;
          const browserErrors = [];
          const browser = await chromium.launch({ headless: true, args: ['--use-gl=swiftshader', '--enable-webgl'] });

          async function openReadyPage(page, label) {
            page.on('pageerror', error => browserErrors.push(label + ': ' + error.message));
            let lastError = '';
            for (let attempt = 0; attempt < 4; attempt++) {
              await page.goto(base + '?smoke=' + Date.now() + '-' + attempt, { waitUntil: 'commit', timeout: 40000 });
              try {
                await page.waitForFunction(() => {
                  const start = document.getElementById('startScreen');
                  const error = document.getElementById('moduleError');
                  return (start && !start.classList.contains('hidden')) ||
                    (error && getComputedStyle(error).display !== 'none');
                }, null, { timeout: 35000 });
              } catch (e) {
                lastError = String(e);
              }
              const freshGame = await page.evaluate(() => window.__CITYLIFE_READY === true && !!window.__CITYLIFE_ASSET_STATUS).catch(() => false);
              if (freshGame && await page.locator('#startBtn').isVisible().catch(() => false)) return;
              lastError = await page.evaluate(() => 'title=' + document.title + '; ready=' + String(window.__CITYLIFE_READY) + '; assets=' + String(!!window.__CITYLIFE_ASSET_STATUS)).catch(() => 'Game page did not become ready');
              await page.waitForTimeout(6000);
            }
            throw new Error(label + ' failed to show the game start screen: ' + lastError);
          }

          async function checkViewport(label, viewport, mobile, landscape) {
            const context = await browser.newContext({
              viewport,
              deviceScaleFactor: 1,
              isMobile: mobile,
              hasTouch: mobile
            });
            const page = await context.newPage();
            await openReadyPage(page, label);

            const status = await page.evaluate(() => window.__CITYLIFE_ASSET_STATUS || null);
            assert.ok(status && status.total >= 10, label + ': asset-load diagnostics missing');
            console.log(label + ': loaded ' + status.good + '/' + status.total + ' public CC0 models');
            assert.ok(status.good >= 1, label + ': no external CC0 model loaded; check asset host/CORS');

            assert.equal(await page.locator('#world canvas').count(), 1, label + ': 3D canvas missing');
            await page.screenshot({ path: 'artifacts/' + label + '-start.png' });
            await page.locator('#startBtn').click();
            await page.waitForFunction(() => {
              const hud = document.getElementById('hud');
              return hud && !hud.classList.contains('hidden');
            });
            assert.ok(await page.locator('#objectiveTitle').innerText(), label + ': mission title missing');
            assert.ok(await page.locator('#objectiveDistance').innerText(), label + ': objective distance missing');

            await page.locator('#mapBtn').click();
            assert.equal(await page.locator('#mapScreen').isVisible(), true, label + ': map did not open');
            assert.equal(await page.locator('#mapCanvas').count(), 1, label + ': map canvas missing');
            await page.locator('#closeMap').click();

            const joyDisplay = await page.locator('#joystick').evaluate(el => getComputedStyle(el).display);
            if (mobile || landscape) assert.notEqual(joyDisplay, 'none', label + ': touch joystick is hidden');
            const objectiveBox = await page.locator('.objective').boundingBox();
            assert.ok(objectiveBox.x >= 0 && objectiveBox.x + objectiveBox.width <= viewport.width + 1, label + ': objective panel spills off screen');
            const actionBox = await page.locator('.actions').boundingBox();
            assert.ok(actionBox.x >= 0 && actionBox.y >= 0 && actionBox.x + actionBox.width <= viewport.width + 1 && actionBox.y + actionBox.height <= viewport.height + 1, label + ': action buttons are clipped');

            if (label === 'desktop') {
              const before = Number((await page.locator('#objectiveDistance').innerText()).match(/\d+/)?.[0]);
              await page.keyboard.down('Shift');
              await page.keyboard.down('ArrowUp');
              await page.waitForTimeout(3700);
              await page.keyboard.up('ArrowUp');
              await page.keyboard.up('Shift');
              const after = Number((await page.locator('#objectiveDistance').innerText()).match(/\d+/)?.[0]);
              assert.ok(Number.isFinite(before) && Number.isFinite(after) && after < before, 'keyboard movement did not reduce the objective distance: ' + before + ' -> ' + after);
              assert.equal(await page.locator('#interactLabel').innerText(), '完成任務', 'contextual mission interaction did not appear near target');
              await page.locator('#interactBtn').click();
              assert.equal(await page.locator('#missionProgress').innerText(), '1 / 3', 'first mission did not complete');
              assert.equal(await page.locator('#cashValue').innerText(), '$ 680', 'mission reward did not update cash');
              console.log('desktop: keyboard navigation, contextual action, and first mission passed');
            }

            if (mobile && !landscape) {
              const rect = await page.locator('#joystick').boundingBox();
              await page.mouse.move(rect.x + rect.width / 2, rect.y + rect.height / 2);
              await page.mouse.down();
              await page.mouse.move(rect.x + rect.width / 2, rect.y + rect.height / 2 - 24, { steps: 5 });
              await page.waitForTimeout(500);
              await page.mouse.up();
              const stickTransform = await page.locator('#joyStick').evaluate(el => el.style.transform);
              assert.ok(stickTransform.includes('translate'), 'joystick pointer handling did not run');
            }

            await page.screenshot({ path: 'artifacts/' + label + '-game.png' });
            await context.close();
          }

          (async () => {
            try {
              await checkViewport('desktop', { width: 1280, height: 800 }, false, false);
              await checkViewport('phone-portrait', { width: 390, height: 844 }, true, false);
              await checkViewport('phone-landscape', { width: 844, height: 390 }, true, true);
              assert.deepEqual(browserErrors, [], 'browser runtime errors: ' + browserErrors.join(' | '));
              console.log('PASS: desktop, phone portrait, phone landscape, map, HUD, movement, and mission flow');
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-life-browser-screenshots
          path: artifacts/
          if-no-files-found: ignore
