<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101a28"><title>LOW POLY CITY: 街頭任務</title>
<style>
:root{color-scheme:dark;--glass:rgba(10,18,29,.86);--line:rgba(255,255,255,.17);--cyan:#55e6ff;--gold:#ffd166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a28;color:#fff;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}button{font:inherit;color:white;border:1px solid var(--line);background:rgba(24,39,56,.92);border-radius:14px;padding:10px 14px;font-weight:800;box-shadow:0 5px 18px #0004}button:active,.active{background:#087f91!important;border-color:var(--cyan)!important}.panel{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);border-radius:16px;box-shadow:0 8px 24px #0004}.hud{position:fixed;inset:0;pointer-events:none}.hud>*{pointer-events:auto}.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.brand{padding:10px 13px;min-width:0}.brand b{display:block;font-size:14px;letter-spacing:1.3px;color:var(--cyan)}.brand small{display:block;color:#c2d0df;font-size:11px;margin-top:3px}.stats{padding:9px 12px;min-width:108px;text-align:right;font-size:12px;line-height:1.7}.stats strong{color:var(--gold)}.mission{position:absolute;top:86px;left:50%;transform:translateX(-50%);width:min(340px,calc(100vw - 28px));padding:10px 13px;text-align:center}.mission .label{font-size:10px;letter-spacing:2px;color:var(--gold);font-weight:900}.mission b{display:block;font-size:15px;margin:2px}.mission small{color:#c8d5e2;font-size:11px}.hint{position:absolute;left:12px;bottom:18px;padding:9px 12px;max-width:min(280px,52vw);font-size:11px;color:#d5e1ed;line-height:1.5}.right-actions{position:absolute;right:12px;bottom:18px;display:grid;grid-template-columns:repeat(2,minmax(68px,82px));gap:8px}.action{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px}.action span{font-size:21px}.joystick{position:absolute;left:20px;bottom:100px;width:116px;height:116px;border-radius:50%;background:#d8f5ff12;border:2px solid #d8f5ff55;box-shadow:inset 0 0 0 12px #ffffff08;display:none;touch-action:none}.stick{position:absolute;width:48px;height:48px;left:32px;top:32px;border-radius:50%;background:#67dff0bb;border:2px solid #d7fbff;box-shadow:0 4px 15px #0006}.center-msg{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);text-align:center;width:min(440px,calc(100vw - 28px));padding:23px 20px}.center-msg h1{font-size:clamp(24px,5vw,36px);margin:0 0 6px;letter-spacing:1px}.center-msg p{font-size:13px;line-height:1.7;color:#d0deec;margin:8px 0 18px}.primary{background:linear-gradient(135deg,#08a8b9,#087a9a);border:0;padding:13px 22px}.loader{position:fixed;inset:0;display:grid;place-items:center;background:#101a28;z-index:10}.loader p{color:#d0deec;font-size:13px;text-align:center;padding:24px}.hidden{display:none!important}.toast{position:absolute;top:155px;left:50%;transform:translateX(-50%);background:#07121deF;border:1px solid var(--cyan);border-radius:12px;padding:9px 14px;font-size:12px;white-space:normal;text-align:center;max-width:85vw}.crosshair{position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);border:2px solid #fff9;border-radius:50%;pointer-events:none}.desktop-tip{display:inline}.mobile-tip{display:none}
@media(max-width:700px){.brand{padding:8px 10px}.brand b{font-size:12px}.brand small{font-size:10px}.stats{padding:7px 9px;font-size:11px}.mission{top:76px}.hint{bottom:10px;left:8px;max-width:46vw;font-size:10px}.right-actions{right:8px;bottom:10px;grid-template-columns:repeat(2,66px);gap:6px}.action{min-height:54px;padding:6px;font-size:10px;border-radius:12px}.action span{font-size:18px}.joystick{display:block;left:12px;bottom:92px;width:104px;height:104px}.stick{width:44px;height:44px;left:28px;top:28px}.desktop-tip{display:none}.mobile-tip{display:inline}.center-msg{top:48%}}
@media(orientation:landscape) and (max-height:520px){.top{top:6px}.mission{top:68px;left:50%;width:280px;padding:6px 10px}.mission b{font-size:12px}.mission small{font-size:10px}.joystick{left:12px;bottom:12px;width:92px;height:92px}.stick{width:40px;height:40px;left:24px;top:24px}.hint{left:116px;bottom:10px;max-width:210px}.right-actions{bottom:10px;right:10px;grid-template-columns:repeat(2,70px)}.action{min-height:48px}.stats{line-height:1.4}.toast{top:125px}}
</style></head>
<body>
<div id="loader" class="loader"><p>正在載入城市與 3D 引擎…<br><br>第一次載入需要網路，請稍候。</p></div>
<div id="game" class="hidden"></div>
<div id="start" class="center-msg panel hidden"><h1>LOW POLY CITY</h1><p>第三人稱城市沙盒 · 街頭任務<br>跟著地圖上的<strong style="color:#ffd166">金色光柱</strong>走，抵達後按「互動」完成任務。<br>手機用左下搖桿移動；右側按鈕操作。電腦用 WASD／方向鍵。</p><button id="startBtn" class="primary">進入城市</button></div>
<div id="hud" class="hud hidden">
 <div class="top"><div class="brand panel"><b>LOW POLY CITY</b><small>自由探索 · 街頭任務</small></div><div class="stats panel">現金 <strong id="cash">$ 500</strong><br>通緝 <strong id="wanted">☆☆☆☆☆</strong><br><span id="vehicleState">步行中</span></div></div>
 <div class="mission panel"><div class="label">目前任務 / CURRENT OBJECTIVE</div><b id="missionTitle">前往金色標記</b><small id="missionSub">走到光柱旁，再按「互動」</small></div>
 <div id="toast" class="toast hidden"></div><div class="crosshair"></div>
 <div id="joystick" class="joystick"><div id="stick" class="stick"></div></div>
 <div class="hint panel"><b>操作提示</b><br><span class="desktop-tip">WASD／方向鍵移動 · 滑鼠拖曳轉視角</span><span class="mobile-tip">左下搖桿移動 · 拖曳畫面轉視角</span><br>靠近車輛可上車；靠近金色光柱完成任務。</div>
 <div class="right-actions"><button class="action" id="interact"><span>✦</span>互動</button><button class="action" id="jump"><span>↟</span>跳躍</button><button class="action" id="sprint"><span>➤</span>奔跑</button><button class="action" id="attack"><span>✦</span>動作</button></div>
</div>
<script>
(()=> {
const $=id=>document.getElementById(id);
const loader=$('loader');let scene,camera,renderer,clock,player,marker,threeReady=false,started=false,vehicle=null,inCar=false,cash=500,wanted=0,mission=0,toastTimer=0,keys={},joy={x:0,y:0},drag=null,yaw=0,pitch=.28,velocityY=0,onGround=true,objects=[],cars=[],buildings=[],lastTime=0;
const missions=[{title:'找到街角的金色標記',sub:'走到金色光柱旁，按「互動」',reward:250},{title:'探索城市大道',sub:'前往下一個金色光柱',reward:400},{title:'完成街頭挑戰',sub:'到達目的地領取獎勵',reward:600},{title:'城市自由探索',sub:'任務完成！繼續探索城市',reward:0}];
function say(s){const t=$('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2400)}
function setMission(){const m=missions[Math.min(mission,missions.length-1)];$('missionTitle').textContent=m.title;$('missionSub').textContent=m.sub}
function updateHUD(){$('cash').textContent='$ '+cash.toLocaleString();$('wanted').textContent='★'.repeat(wanted)+'☆'.repeat(5-wanted);$('vehicleState').textContent=inCar?'駕駛中':'步行中'}
function mat(color,rough=.85){return new THREE.MeshStandardMaterial({color,roughness:rough})}
function box(w,h,d,color,x,y,z,group=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;group.add(o);return o}
function makeCity(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x9bd4e8);scene.fog=new THREE.Fog(0x9bd4e8,75,230);
 camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,400);
 renderer=new THREE.WebGLRenderer({antialias:innerWidth>700,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<700?1.4:1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=innerWidth>700;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;$('game').appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xdaf4ff,0x65704c,2.1));const sun=new THREE.DirectionalLight(0xffedca,3);sun.position.set(-35,70,25);sun.castShadow=innerWidth>700;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(240,240),mat(0x8aa477));ground.rotation.x=-Math.PI/2;ground.position.y=-.12;ground.receiveShadow=true;scene.add(ground);
 // A readable street grid with sidewalks, lane lines, crossings, lamps and trees.
 for(let k=-4;k<=4;k++){
  const p=k*24;box(9,.08,220,0x343e4b,p,.0,0);box(2,.12,220,0xb9b7a8,p-5.5,.04,0);box(2,.12,220,0xb9b7a8,p+5.5,.04,0);
  box(.13,.025,220,0xf3d78b,p,.06,0);
  box(220,.08,9,0x343e4b,0,.0,p);box(220,.12,2,0xb9b7a8,0,.04,p-5.5);box(220,.12,2,0xb9b7a8,0,.04,p+5.5);box(220,.025,.13,0xf3d78b,0,.06,p);
 }
 for(let gx=-3;gx<=3;gx++)for(let gz=-3;gz<=3;gz++){
  const cx=gx*24,cz=gz*24;
  if(Math.abs(cx)<15&&Math.abs(cz)<15)continue;
  const count=2+Math.floor(Math.random()*3);
  for(let n=0;n<count;n++){
   const x=cx+(Math.random()-.5)*12,z=cz+(Math.random()-.5)*12,w=4+Math.random()*5,d=4+Math.random()*5,h=5+Math.random()*20;
   const palette=[0xc8a58a,0xd2d8d8,0x8cabb7,0xd9c58e,0xa8b8a1,0xb4a0b5];const color=palette[Math.floor(Math.random()*palette.length)];
   const b=box(w,h,d,color,x,h/2,z);buildings.push(b);
   box(w+.12,.25,d+.12,0x3d5363,x,h+.12,z);
   for(let yy=2;yy<h-1;yy+=2.8){for(let xx=-w/2+.8;xx<w/2-.2;xx+=1.5){const win=box(.55,.75,.06,Math.random()>.22?0x8de3ed:0x435765,x+xx,yy,z+d/2+.04);win.castShadow=false;}}
  }
  // trees in parks between buildings
  for(let n=0;n<2;n++){const x=cx+(Math.random()-.5)*12,z=cz+(Math.random()-.5)*12;if(Math.abs(x)<10&&Math.abs(z)<10)continue;box(.45,2,.45,0x70523a,x,1,z);const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.7,1),mat([0x477e56,0x5d9259,0x6a9e63][n%3]));crown.position.set(x,3,z);crown.castShadow=true;scene.add(crown)}
 }
 // street lamps
 for(let i=-4;i<=4;i++)for(let side of [-1,1]){const x=i*24+side*7,z=-84;box(.14,4,.14,0x4a5863,x,2,z);const bulb=new THREE.Mesh(new THREE.SphereGeometry(.32,8,6),new THREE.MeshStandardMaterial({color:0xffe3a1,emissive:0xffbd5a,emissiveIntensity:.8}));bulb.position.set(x,4.1,z);scene.add(bulb)}
 // player with colored jacket, head and visible facing marker
 player=new THREE.Group();const body=box(.8,1.1,.48,0x168eab,0,.95,0,player);body.position.y=.95;box(.62,.62,.62,0xf0c49b,0,1.85,0,player);box(.7,.16,.7,0x26354b,0,2.18,0,player);box(.25,.55,.25,0x243c59,-.23,.32,0,player);box(.25,.55,.25,0x243c59,.23,.32,0,player);scene.add(player);player.position.set(0,0,0);
 // mission beacon, base ring and floating diamond
 marker=new THREE.Group();const ring=new THREE.Mesh(new THREE.TorusGeometry(2.1,.13,8,36),new THREE.MeshStandardMaterial({color:0xffd166,emissive:0xffa900,emissiveIntensity:1.1}));ring.rotation.x=Math.PI/2;ring.position.y=.12;marker.add(ring);const beam=new THREE.Mesh(new THREE.CylinderGeometry(.15,.8,5,8,1,true),new THREE.MeshBasicMaterial({color:0xffd166,transparent:true,opacity:.23,side:THREE.DoubleSide}));beam.position.y=2.7;marker.add(beam);const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.65),new THREE.MeshStandardMaterial({color:0xffed8a,emissive:0xff9e00,emissiveIntensity:1.4}));gem.position.y=5.4;marker.add(gem);scene.add(marker);marker.position.set(24,0,24);
 // traffic cars: vivid silhouettes with cabin, wheels, windshield
 const carColors=[0xe85d5d,0x3c86db,0xf4c84e,0x42b883,0x9b75d7,0xe8e8e8];
 for(let i=0;i<10;i++){const car=new THREE.Group();const col=carColors[i%carColors.length];box(2.15,.7,4,col,0,.65,0,car);box(1.45,.65,1.8,0x8cc4d8,0,1.25,-.2,car);for(const wx of [-1.08,1.08])for(const wz of [-1.25,1.25]){const wh=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.18,10),mat(0x20242a));wh.rotation.z=Math.PI/2;wh.position.set(wx,.35,wz);car.add(wh)}box(1.5,.15,.12,0xffefb0,0,.7,2.02,car);box(1.5,.15,.12,0xe55c5c,0,.7,-2.02,car);car.position.set(-48+i*10,0,i%2?12:-12);car.rotation.y=i%2?0:Math.PI;car.userData={speed:.6+Math.random()*1.2,baseX:car.position.x,baseZ:car.position.z};scene.add(car);cars.push(car)}
 clock=new THREE.Clock();
}
function moveMarker(){const spots=[[24,24],[-24,48],[48,-24],[-48,-24]];const s=spots[mission%spots.length];marker.position.set(s[0],0,s[1]);}
function nearestCar(){let best=null,dist=5;for(const c of cars){const d=c.position.distanceTo(player.position);if(d<dist){best=c;dist=d}}return best}
function interact(){if(!started)return;if(inCar){inCar=false;player.visible=true;player.position.x=vehicle.position.x+2.5;player.position.z=vehicle.position.z;vehicle=null;updateHUD();say('你已下車');return}
 const c=nearestCar();if(c){vehicle=c;inCar=true;player.visible=false;updateHUD();say('已上車！用搖桿或 WASD 駕駛');return}
 if(player.position.distanceTo(marker.position)<5.2){const reward=missions[Math.min(mission,missions.length-1)].reward;cash+=reward;mission++;setMission();moveMarker();updateHUD();say(reward?'任務完成！獲得 $'+reward:'任務已全部完成，自由探索吧！');return}
 say('靠近金色光柱完成任務，或走到車旁按互動上車。')}
function bindControls(){
 addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key==='e'||e.key==='Enter')interact();if(e.key===' '&&!inCar)jump()});
 addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
 const joyEl=$('joystick'),stick=$('stick');function joyMove(e){const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=r.width*.34,len=Math.hypot(dx,dy)||1;if(len>max){dx=dx/len*max;dy=dy/len*max}joy.x=dx/max;joy.y=dy/max;stick.style.transform='translate('+dx+'px,'+dy+'px)'}
 joyEl.addEventListener('pointerdown',e=>{e.preventDefault();joyEl.setPointerCapture(e.pointerId);joyMove(e)});joyEl.addEventListener('pointermove',e=>{if(e.buttons)joyMove(e)});const joyEnd=()=>{joy.x=joy.y=0;stick.style.transform='translate(0,0)'};joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
 renderer.domElement.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,id:e.pointerId};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;yaw-=dx*.006;pitch=Math.max(.12,Math.min(.8,pitch+dy*.003));drag.x=e.clientX;drag.y=e.clientY});renderer.domElement.addEventListener('pointerup',()=>drag=null);renderer.domElement.addEventListener('pointercancel',()=>drag=null);
 $('interact').addEventListener('click',interact);$('jump').addEventListener('click',jump);$('sprint').addEventListener('pointerdown',()=>keys.shift=true);$('sprint').addEventListener('pointerup',()=>keys.shift=false);$('sprint').addEventListener('pointercancel',()=>keys.shift=false);$('attack').addEventListener('click',()=>{wanted=Math.min(5,wanted+1);updateHUD();say('街頭動作！通緝等級上升（沙盒效果）')});
}
function jump(){if(onGround&&!inCar){velocityY=7.4;onGround=false}}
function tick(){
 requestAnimationFrame(tick);if(!renderer||!scene)return;const dt=Math.min(clock.getDelta(),.04);
 if(started){
  let f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-joy.y;
  let side=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x;
  const moving=Math.abs(f)+Math.abs(side)>.08;const speed=(keys.shift?12:inCar?16:6.2);
  const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  const delta=forward.multiplyScalar(f).add(right.multiplyScalar(side));if(delta.length()>1)delta.normalize();
  if(inCar&&vehicle){vehicle.position.addScaledVector(delta,speed*dt);vehicle.position.x=Math.max(-105,Math.min(105,vehicle.position.x));vehicle.position.z=Math.max(-105,Math.min(105,vehicle.position.z));if(moving)vehicle.rotation.y=Math.atan2(-delta.x,-delta.z);player.position.copy(vehicle.position)}
  else{player.position.addScaledVector(delta,speed*dt);player.position.x=Math.max(-108,Math.min(108,player.position.x));player.position.z=Math.max(-108,Math.min(108,player.position.z));if(moving)player.rotation.y=Math.atan2(-delta.x,-delta.z);velocityY-=18*dt;player.position.y+=velocityY*dt;if(player.position.y<=0){player.position.y=0;velocityY=0;onGround=true}}
  cars.forEach(c=>{c.position.x+=c.userData.speed*dt;if(c.position.x>108)c.position.x=-108});
  marker.children[2].rotation.y+=dt*1.3;marker.children[2].position.y=5.2+Math.sin(performance.now()*.002)*.3;marker.children[1].material.opacity=.18+Math.sin(performance.now()*.002)*.06;
  const target=inCar&&vehicle?vehicle.position:player.position;const offset=new THREE.Vector3(Math.sin(yaw)*10,5+pitch*5,Math.cos(yaw)*10);const desired=target.clone().add(offset);camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(target.x,target.y+1.3,target.z);
 }
 renderer.render(scene,camera);
}
function init(){if(!window.THREE){throw Error('3D 引擎載入失敗，請確認網路後重試。')}makeCity();bindControls();setMission();updateHUD();threeReady=true;loader.classList.add('hidden');$('game').classList.remove('hidden');$('start').classList.remove('hidden');tick()}
function loadThree(urls,i=0){if(i>=urls.length){loader.innerHTML='<p>無法載入 3D 引擎。<br>請確認網路連線後重新整理頁面。<br><br><button onclick="location.reload()">重新載入</button></p>';return}const s=document.createElement('script');s.src=urls[i];s.onload=()=>{try{init()}catch(e){loader.innerHTML='<p>啟動失敗：'+String(e.message||e)+'<br><br><button onclick="location.reload()">重新載入</button></p>'}};s.onerror=()=>loadThree(urls,i+1);document.head.appendChild(s)}
$('startBtn').addEventListener('click',()=>{started=true;$('start').classList.add('hidden');$('hud').classList.remove('hidden');say('出發！先前往地圖上的金色光柱');});
addEventListener('resize',()=>{if(camera&&renderer){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}});
loadThree(['https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://unpkg.com/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js']);
})();
</script></body></html>
