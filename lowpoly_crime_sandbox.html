<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LOW POLY CITY — 3D 開放世界</title>
<style>
html,body{margin:0;min-height:100%;background:#081321;color:#eaf7ff;font:16px system-ui,sans-serif}
main{max-width:620px;margin:12vh auto;padding:28px}h1{color:#66e5ff}p{line-height:1.7;color:#c5d6e5}#status{padding:12px;border:1px solid #456174;border-radius:10px;background:#102033}
</style>
</head>
<body>
<main><h1>LOW POLY CITY</h1><p>正在載入 3D 城市遊戲……</p><p id="status">準備遊戲資料。</p></main>
<script>
(async()=>{
 const status=document.getElementById("status");
 try{
  if(!("DecompressionStream" in window)) throw new Error("這個瀏覽器不支援內建壓縮解碼，請更新 Safari 或 Chrome。");
  status.textContent="正在下載遊戲資料……";
  const response=await fetch("https://raw.githubusercontent.com/pixelproto-x/love-test-2/main/lowpoly_crime_sandbox_payload.txt");
  if(!response.ok) throw new Error("遊戲資料下載失敗（HTTP "+response.status+"）。");
  const b64=(await response.text()).trim();
  const binary=atob(b64);
  const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  status.textContent="正在啟動 3D 引擎……";
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  const html=await new Response(stream).text();
  if(!html.includes('LOW POLY CITY')||!html.includes('loadThree')) throw new Error("遊戲資料驗證失敗，請重新整理。");
  document.open();
  document.write(html);
  document.close();
 }catch(error){
  status.textContent="啟動失敗："+(error&&error.message?error.message:String(error))+"。請確認網路連線後重新整理。";
 }
})();
</script>
</body>
</html>
